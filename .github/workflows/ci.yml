name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install pytest pyyaml
          python -m pip install -r skills/engineering/engineering-workflow/requirements.txt
      - name: Verify generated skill index and routing catalogue
        run: python scripts/build_skill_index.py --check
      - name: Verify skill routing descriptions and scenario coverage
        run: python scripts/validate_skill_descriptions.py
      - name: Run skill tests
        run: |
          python -m pytest \
            skills/engineering/engineering-workflow/tests \
            skills/engineering/repo-setup/tests \
            skills/meta/skill-finaliser/tests \
            scripts/tests
