name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Verify generated skill index
        run: |
          python scripts/build_skill_index.py
          git diff --exit-code -- INDEX.md
      - name: Run skill tests
        run: |
          python -m pytest \
            skills/engineering/repo-knowledge-engineering/tests \
            skills/engineering/repo-setup/tests \
            skills/engineering/repo-task-lifecycle/tests \
            skills/engineering/worktree-task-coordinator/tests \
            skills/meta/skill-finaliser/tests
