name: Publish Skills Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate repo version semantics
        shell: bash
        run: |
          python scripts/validate_release_version.py "${GITHUB_REF_NAME}"
          expected_tag="v$(cat VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${expected_tag}" >&2
            exit 1
          fi

      - name: Upload version metadata
        uses: actions/upload-artifact@v6
        with:
          name: skills-version-metadata
          path: version-metadata.json

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "version-metadata.json#skills-version-metadata.json" --clobber
            gh release edit "$tag" --draft=false --latest --verify-tag --title "$tag"
          else
            gh release create "$tag" \
              "version-metadata.json#skills-version-metadata.json" \
              --verify-tag \
              --generate-notes \
              --latest \
              --title "$tag"
          fi
