change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: "\\<*_&"
template: |
  ## Changes

  $CHANGES

no-changes-template: "- No labeled changes were included in this draft."

categories:
  - title: "Features"
    labels:
      - "feature"
      - "enhancement"
      - "feat"
  - title: "Fixes"
    labels:
      - "fix"
      - "bug"
      - "bugfix"
  - title: "Documentation"
    labels:
      - "docs"
  - title: "Maintenance"
    labels:
      - "chore"
      - "refactor"
      - "test"
      - "ci"

exclude-labels:
  - "skip-release-notes"
