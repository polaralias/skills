interface:
  display_name: setup-polaralias-skills
  short_description: Create or refresh shared Polaralias defaults for branded
    skills.
  default_prompt: 'Use setup-polaralias-skills when the task matches this skill:
    configure shared Polaralias skill defaults outside installed skill folders.
    Use when a user wants to set or refresh cross-repo defaults such as branding,
    typography, logos, palette values, footer text, output tone, or reusable asset
    paths for other Polaralias skills.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  allow_implicit_invocation: true
  products:
  - chatgpt
  - codex
  - api
  - atlas
